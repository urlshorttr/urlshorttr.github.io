  opt_label: "कस्टम अंत"
  opt_placeholder: "my_launch_page"
  opt_hint: "5 से 30 अक्षर, अंक या अंडरस्कोर। अगर वह पहले से लिया जा चुका है तो दूसरा चुनें।"
  copy: "लिंक कॉपी करें"
  open: "लिंक खोलें"
  dl_png: "PNG डाउनलोड करें"
  dl_svg: "SVG डाउनलोड करें"
  qr_aria: "आपके शॉर्ट लिंक का QR कोड"
  recent_h: "इस डिवाइस पर हाल के लिंक"
  recent_hint: "ये सिर्फ़ इसी ब्राउज़र में सेव रहते हैं।"
  recent_clear: "सूची साफ़ करें"
  how_h: "यह कैसे काम करता है"
  steps:
    - t: "अपना लिंक पेस्ट करें"
      d: "कोई भी http या https पता चलेगा, ट्रैकिंग पैरामीटर वाले लंबे पते भी।"
    - t: "उसे छोटा करें"
      d: "हमारी लिंक सेवा आपका पता सेव करती है और urlshort.tr पर एक छोटा पता देती है। पढ़ने में आसान बनाने के लिए अपना अंत जोड़ें।"
    - t: "कॉपी करें या स्कैन करें"
      d: "शॉर्ट लिंक कॉपी करें, या पर्चे, मेन्यू, स्लाइड या प्रोडक्ट लेबल के लिए उसका QR कोड डाउनलोड करें।"
  when_h: "शॉर्ट लिंक कब काम आता है"
  when:
    - t: "मैसेज और प्रोफ़ाइल"
      d: "शॉर्ट लिंक बायो, मैसेज या कैप्शन में कम जगह लेता है और तीन लाइनों में नहीं टूटता।"
    - t: "हर छपी हुई चीज़"
      d: "शॉर्ट लिंक के QR कोड में कम और बड़े चौकोर होते हैं, इसलिए दूर से या छोटे लेबल पर भी स्कैन करना आसान होता है। डिज़ाइन प्रिंटर को भेजने से पहले <a href='[[print_guide]]'>हमारी प्रिंट गाइड</a> पढ़ें।"
    - t: "स्लाइड, वीडियो और पॉडकास्ट"
      d: "लोग स्क्रीन से शॉर्ट लिंक टाइप कर सकते हैं, और आप उसे बोलकर भी बता सकते हैं।"
    - t: "उलझे हुए पते साफ़ करना"
      d: "दुकानों, मैप और सर्च से कॉपी किए लिंक में अक्सर प्रश्नचिह्न के बाद लंबी स्ट्रिंग होती है। शॉर्ट लिंक शेयर करते समय वह गंदगी छिपा देता है।"
  know_h: "इस्तेमाल से पहले जानने की बातें"
  know:
    - "शॉर्ट लिंक urlshort.tr पर बनते हैं और आपके दिए पते पर भेजते हैं। साइन-अप की ज़रूरत नहीं।"
    - "लिंक बनने के बाद बदला नहीं जा सकता। बटन दबाने से पहले पता जाँच लें।"
    - "जिसके पास शॉर्ट लिंक है वह उसे खोल सकता है। निजी पेज को शॉर्ट न करें।"
    - "दूसरी शॉर्ट-लिंक सेवाओं के लिंक स्वीकार नहीं किए जाते, और हानिकारक लिंक हटा दिए जाते हैं।"
    - "खोलने से पहले देखें कि लिंक कहाँ जाता है: लिंक के अंत में प्लस (+) जोड़ें, या <a href='[[check]]'>लिंक चेकर</a> इस्तेमाल करें। <a href='[[safe_guide]]'>शॉर्ट लिंक जाँचने की गाइड</a> में और जानकारी है।"
    - "कोई हानिकारक लिंक मिला? <a href='[[report]]'>उसकी शिकायत करें</a>।"
  faq_h: "अक्सर पूछे जाने वाले सवाल"
  faq:
    - q: "क्या यह URL शॉर्टनर मुफ़्त है?"
      a: "हाँ। कुछ भी देना नहीं है और साइन-अप नहीं करना है। साइट विज्ञापनों से चलती है।"
    - q: "क्या शॉर्ट लिंक की समय-सीमा खत्म होती है?"
      a: "कोई समाप्ति तिथि तय नहीं है। लिंक तब तक चलता है जब तक उसे हटाया न जाए, जैसे दुरुपयोग की शिकायत पर। ज़रूरी चीज़ों के लिए मूल पता कहीं सुरक्षित रखें।"
    - q: "क्या मैं शॉर्ट लिंक की मंज़िल बदल सकता हूँ?"
      a: "नहीं। शॉर्ट लिंक उसी पते पर जाता है जिससे वह बना था। अगर पेज बदल जाए तो नया शॉर्ट लिंक बनाएँ और पुराना बदल दें।"
    - q: "क्या आप क्लिक ट्रैक करते हैं?"
      a: "नहीं। यह सेवा क्लिक नहीं गिनती और लिंक खोलने वालों की प्रोफ़ाइल नहीं बनाती।"
    - q: "क्या आप मेरे छोटे किए लिंक सेव करते हैं?"
      a: "हाँ, पता और उसका छोटा अंत हमारी लिंक सेवा पर सेव होता है, क्योंकि रीडायरेक्ट ऐसे ही काम करता है। कोई अकाउंट नहीं होता। आपके हाल के लिंक की छोटी सूची आपके ब्राउज़र में भी रहती है, जिसे आप कभी भी साफ़ कर सकते हैं।"
    - q: "क्या QR कोड हर फ़ोन पर चलेगा?"
      a: "यह मानक QR कोड है, इसलिए आज के फ़ोन कैमरे और स्कैनर ऐप इसे पढ़ लेते हैं। छापने से पहले फ़ोन से ज़रूर जाँचें और कोड के चारों ओर की सफ़ेद जगह न हटाएँ।"
    - q: "क्या मैं QR कोड छपी सामग्री या प्रोडक्ट पर इस्तेमाल कर सकता हूँ?"
      a: "हाँ। प्रिंटर वेक्टर फ़ाइल माँगे तो SVG डाउनलोड करें, दस्तावेज़ और स्क्रीन के लिए PNG। यह ज़रूर देख लें कि जिस पेज का लिंक दे रहे हैं उस पर लिंक करने की अनुमति आपके पास है।"
qr:
  h1: "QR कोड जनरेटर"
  lead: "वेब पता या कोई भी टेक्स्ट लिखें और कोड तुरंत दिख जाएगा। दस्तावेज़ और स्क्रीन के लिए PNG में, प्रिंट के लिए SVG में डाउनलोड करें। आप जो लिखते हैं वह आपके डिवाइस से बाहर नहीं जाता।"
