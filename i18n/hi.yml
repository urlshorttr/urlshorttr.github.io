  level_q: "क्वार्टाइल (लगभग 25%)"
  level_h: "उच्च (लगभग 30%)"
  fg_label: "कोड का रंग"
  bg_label: "बैकग्राउंड"
  empty: "आपका QR कोड यहाँ दिखेगा।"
  qr_aria: "आपका QR कोड"
  which_h: "कौन-सी फ़ाइल डाउनलोड करूँ?"
  png_t: "PNG"
  png_d: "पिक्सल की बनी तस्वीर। दस्तावेज़, स्लाइड, वेबसाइट और मैसेज में इस्तेमाल करें। छापना हो तो बड़ा साइज़ चुनें।"
  svg_t: "SVG"
  svg_d: "वेक्टर फ़ाइल जो किसी भी साइज़ पर साफ़ रहती है। प्रिंटर को यही भेजें, या साइन और पैकेजिंग के लिए इस्तेमाल करें।"
  tips_h: "स्कैन होने वाले कोड के सुझाव"
  tips:
    - "हल्के बैकग्राउंड पर गहरा कोड सबसे अच्छा स्कैन होता है। कंट्रास्ट ऊँचा रखें।"
    - "सफ़ेद किनारा रहने दें। स्कैनर को कोने पहचानने के लिए उसकी ज़रूरत होती है।"
    - "छोटा टेक्स्ट सरल कोड बनाता है। लंबे पते के लिए <a href='[[home]]'>पहले लिंक छोटा करें</a>।"
    - "ज़्यादा त्रुटि सुधार से कोड घिसने पर भी चलता है, पर चौकोर छोटे हो जाते हैं।"
    - "छापने से पहले फ़ोन से जाँचें। हमारी <a href='[[qr_guide]]'>साइज़ और कंट्रास्ट गाइड</a> में विवरण हैं।"
  faq_h: "अक्सर पूछे जाने वाले सवाल"
  faq:
    - q: "क्या यह QR कोड जनरेटर मुफ़्त है?"
      a: "हाँ। साइन-अप नहीं, वॉटरमार्क नहीं और डाउनलोड की कोई सीमा नहीं।"
    - q: "क्या QR कोड की समय-सीमा खत्म होती है?"
      a: "नहीं। कोड चौकोरों में बना टेक्स्ट ही है, इसलिए वह तब तक चलता है जब तक उसमें दिया पेज या टेक्स्ट मौजूद है। यह स्थिर कोड है, ट्रैक किया जाने वाला नहीं।"
    - q: "क्या मेरा टेक्स्ट किसी सर्वर पर भेजा जाता है?"
      a: "नहीं। कोड आपके ब्राउज़र में बनता है। शॉर्ट लिंक भी चाहिए तो <a href='[[home]]'>URL शॉर्टनर</a> इस्तेमाल करें, जो पता हमारी लिंक सेवा को भेजता है।"
    - q: "QR कोड में क्या डाल सकते हैं?"
      a: "वेब पता सबसे आम है, पर कोई भी टेक्स्ट चलता है, सबसे कम त्रुटि सुधार पर लगभग 2,900 अक्षरों तक। अगर टेक्स्ट बहुत लंबा होने का संदेश दिखे तो उसे छोटा करें।"
    - q: "क्या मैं कोड प्रोडक्ट या पोस्टर पर छाप सकता हूँ?"
      a: "हाँ। SVG डाउनलोड करें, किनारा रखें और पहले छपे प्रूफ़ पर स्कैन जाँचें।"
