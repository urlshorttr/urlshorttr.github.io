home:
  h1: "लिंक छोटा करें। उसका QR कोड पाएँ।"
  lead: "कोई भी लंबा वेब पता पेस्ट करें और छोटा लिंक पाएँ जिसे आप कॉपी, शेयर या प्रिंट कर सकें। QR कोड आपके डिवाइस पर बनता है और PNG या SVG में डाउनलोड होता है। अकाउंट की ज़रूरत नहीं।"
