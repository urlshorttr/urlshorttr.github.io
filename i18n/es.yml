home:
  h1: "Acorta un enlace. Consigue su código QR."
  lead: "Pega una dirección web larga y obtén una corta que puedes copiar, compartir o imprimir. El código QR se dibuja en tu dispositivo y se descarga en PNG o SVG. No necesitas cuenta."
  label_url: "Enlace que quieres acortar"
  placeholder: "https://example.com/a/very/long/page?with=parameters"
  btn_shorten: "Acortar enlace"
  opt_summary: "Elige tu propio final (opcional)"
  opt_label: "Final personalizado"
  opt_placeholder: "my_launch_page"
  opt_hint: "De 5 a 30 letras, números o guiones bajos. Si ya está en uso, elige otro."
  copy: "Copiar enlace"
  open: "Abrir enlace"
  dl_png: "Descargar PNG"
  dl_svg: "Descargar SVG"
  qr_aria: "Código QR de tu enlace corto"
  recent_h: "Enlaces recientes en este dispositivo"
  recent_hint: "Solo se guardan en este navegador."
  recent_clear: "Borrar lista"
  how_h: "Cómo funciona"
  steps:
    - t: "Pega tu enlace"
      d: "Sirve cualquier dirección http o https, también las largas con parámetros de seguimiento."
    - t: "Acórtalo"
      d: "Nuestro servicio guarda tu dirección y te devuelve una corta en urlshort.tr. Añade tu propio final si quieres que sea legible."
    - t: "Copia o escanea"
      d: "Copia el enlace corto o descarga su código QR para un folleto, un menú, una diapositiva o la etiqueta de un producto."
  when_h: "Cuándo ayuda un enlace corto"
  when:
    - t: "Mensajes y perfiles"
      d: "Un enlace corto ocupa menos espacio en una biografía, un mensaje o una descripción, y no se parte en tres líneas."
    - t: "Cualquier material impreso"
      d: "El código QR de un enlace corto tiene menos cuadros y más grandes que el de una dirección larga, así que se escanea mejor a distancia o en una etiqueta pequeña. Lee <a href='[[print_guide]]'>nuestra guía de impresión</a> antes de enviar un diseño a la imprenta."
    - t: "Diapositivas, vídeos y pódcast"
      d: "La gente puede teclear un enlace corto desde una pantalla, y tú puedes decirlo en voz alta sin leer un párrafo de caracteres."
    - t: "Limpiar una dirección enrevesada"
      d: "Los enlaces copiados de tiendas, mapas y buscadores suelen llevar cadenas largas tras el signo de interrogación. Un enlace corto oculta ese desorden al compartirlo."
  know_h: "Qué conviene saber antes de usarlo"
  know:
    - "Los enlaces cortos se crean en urlshort.tr y redirigen a la dirección que escribiste. No hace falta registrarse."
    - "Un enlace no se puede editar una vez creado. Revisa la dirección antes de pulsar el botón."
    - "Cualquiera que tenga un enlace corto puede abrirlo. No acortes páginas que deban ser privadas."
    - "No se aceptan enlaces de otros servicios de acortado, y los enlaces dañinos se eliminan."
    - "Puedes ver adónde lleva un enlace corto antes de abrirlo: añade un signo más (+) al final del enlace o usa <a href='[[check]]'>el comprobador de enlaces</a>. Nuestra guía sobre <a href='[[safe_guide]]'>cómo comprobar enlaces cortos</a> te da más detalles."
    - "¿Has encontrado un enlace dañino? <a href='[[report]]'>Denúncialo</a>."
  faq_h: "Preguntas frecuentes"
  faq:
    - q: "¿Este acortador de URL es gratis?"
      a: "Sí. No hay nada que pagar ni registro. El sitio se mantiene con publicidad."
    - q: "¿Caducan los enlaces cortos?"
      a: "No se fija ninguna fecha de caducidad. Un enlace sigue funcionando hasta que se elimina, por ejemplo si se denuncia por abuso. Guarda la dirección original en un lugar seguro si es importante."
    - q: "¿Puedo cambiar el destino de un enlace corto?"
      a: "No. Un enlace corto apunta a la dirección con la que se creó. Si la página de destino cambia, crea un enlace nuevo y sustituye el anterior."
    - q: "¿Rastreáis los clics?"
      a: "No. El servicio no cuenta clics ni crea un perfil de quienes abren un enlace."
    - q: "¿Guardáis los enlaces que acorto?"
      a: "Sí, la dirección y su final corto se guardan en nuestro servicio de enlaces, porque así funciona la redirección. No hay cuentas. También se guarda en tu navegador un breve historial de tus enlaces recientes, que puedes borrar cuando quieras."
    - q: "¿Funcionará el código QR en todos los teléfonos?"
      a: "Es un código QR estándar, así que las cámaras y aplicaciones de escaneo actuales lo leen. Prueba siempre un código con el teléfono antes de imprimirlo y deja el borde blanco a su alrededor."
    - q: "¿Puedo usar el código QR en material impreso o productos?"
      a: "Sí. Descarga el SVG si la imprenta pide un archivo vectorial, o el PNG para documentos y pantallas. Asegúrate de que puedes enlazar a la página a la que apunta el código."
qr:
  h1: "Generador de códigos QR"
  lead: "Escribe una dirección web o cualquier texto y el código aparece al instante. Descárgalo en PNG para documentos y pantallas, o en SVG para imprimir. Nada de lo que escribes sale de tu dispositivo."
  label_text: "Enlace o texto"
  placeholder: "https://example.com"
  size_label: "Tamaño de descarga"
  size_s: "Pequeño (512 px)"
  size_m: "Mediano (1024 px)"
  size_l: "Grande (2048 px)"
  level_label: "Corrección de errores"
  level_l: "Baja (cerca del 7 %)"
  level_m: "Media (cerca del 15 %)"
  level_q: "Cuartil (cerca del 25 %)"
  level_h: "Alta (cerca del 30 %)"
  fg_label: "Color del código"
  bg_label: "Fondo"
  empty: "Tu código QR aparecerá aquí."
  qr_aria: "Tu código QR"
  which_h: "¿Qué archivo debo descargar?"
  png_t: "PNG"
  png_d: "Una imagen hecha de píxeles. Úsala en documentos, presentaciones, sitios web y mensajes. Elige el tamaño grande si se va a imprimir."
  svg_t: "SVG"
  svg_d: "Un archivo vectorial que se ve nítido a cualquier tamaño. Envíalo a la imprenta o úsalo en carteles y envases."
  tips_h: "Consejos para un código que se escanee bien"
  tips:
    - "Un código oscuro sobre fondo claro se escanea mejor. Mantén un contraste alto."
    - "Deja el borde blanco. Los lectores lo necesitan para encontrar los límites."
    - "Un texto más corto da un código más simple. Para una dirección larga, <a href='[[home]]'>acorta primero el enlace</a>."
    - "Más corrección de errores ayuda a que el código resista el desgaste, pero hace los cuadros más pequeños."
    - "Prueba con un teléfono antes de imprimir. Nuestra <a href='[[qr_guide]]'>guía de tamaño y contraste</a> tiene los detalles."
  faq_h: "Preguntas frecuentes"
  faq:
    - q: "¿Este generador de códigos QR es gratis?"
      a: "Sí. Sin registro, sin marca de agua y sin límite de descargas."
    - q: "¿Caduca el código QR?"
      a: "No. El código es el propio texto dibujado en cuadros, así que funciona mientras exista la página o el texto que contiene. Es un código estático, no con seguimiento."
    - q: "¿Se envía mi texto a un servidor?"
      a: "No. El código se dibuja en tu navegador. Si además quieres un enlace corto, usa el <a href='[[home]]'>acortador de URL</a>, que envía la dirección a nuestro servicio de enlaces."
    - q: "¿Qué puedo poner en un código QR?"
      a: "Lo más habitual es una dirección web, pero sirve cualquier texto, hasta unos 2900 caracteres con la corrección de errores más baja. Si ves un aviso de que el texto es demasiado largo, acórtalo."
    - q: "¿Puedo imprimir el código en un producto o un cartel?"
      a: "Sí. Descarga el SVG, conserva el borde y comprueba el escaneo en una prueba impresa."
check:
  h1: "Comprueba adónde lleva un enlace corto"
  lead: "Pega un enlace corto de este sitio. Verás primero la dirección completa y podrás decidir si continúas."
  label: "Enlace corto"
  placeholder: "urlshort.tr/abc123"
  btn: "Comprobar enlace"
  other_h: "Otras formas de comprobar"
  other:
    - "Añade un signo más (+) al final de cualquier enlace corto de este sitio y ábrelo. Verás la misma página de vista previa."
    - "Esta herramienta solo sirve para enlaces creados en este sitio. Para otros servicios, busca su propia opción de vista previa."
    - "Lee nuestra guía sobre <a href='[[safe_guide]]'>cómo saber si un enlace corto es seguro</a>."
    - "¿Has encontrado un enlace dañino? <a href='[[report]]'>Denúncialo</a>."
