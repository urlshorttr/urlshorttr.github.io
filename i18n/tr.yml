home:
  h1: "Bağlantıyı kısaltın. QR kodunu alın."
  lead: "Uzun bir web adresini yapıştırın; kopyalayabileceğiniz, paylaşabileceğiniz veya yazdırabileceğiniz kısa bir adres alın. QR kod cihazınızda çizilir ve PNG veya SVG olarak iner. Hesap gerekmez."
  label_url: "Kısaltılacak bağlantı"
  placeholder: "https://example.com/a/very/long/page?with=parameters"
  btn_shorten: "Bağlantıyı kısalt"
  opt_summary: "Kendi uzantınızı seçin (isteğe bağlı)"
  opt_label: "Özel uzantı"
  opt_placeholder: "my_launch_page"
  opt_hint: "5 ila 30 harf, rakam veya alt çizgi. Daha önce alınmışsa başka bir tane seçin."
  copy: "Bağlantıyı kopyala"
  open: "Bağlantıyı aç"
  dl_png: "PNG indir"
  dl_svg: "SVG indir"
  qr_aria: "Kısa bağlantınızın QR kodu"
  recent_h: "Bu cihazdaki son bağlantılar"
  recent_hint: "Yalnızca bu tarayıcıda saklanır."
  recent_clear: "Listeyi temizle"
  how_h: "Nasıl çalışır"
  steps:
    - t: "Bağlantınızı yapıştırın"
      d: "Her http veya https adresi olur; izleme parametreleriyle dolu uzun adresler de."
    - t: "Kısaltın"
      d: "Bağlantı hizmetimiz adresinizi kaydeder ve urlshort.tr üzerinde kısa bir adres verir. Okunur olması için kendi uzantınızı ekleyin."
    - t: "Kopyalayın veya taratın"
      d: "Kısa bağlantıyı kopyalayın ya da broşür, menü, slayt veya ürün etiketi için QR kodunu indirin."
  when_h: "Kısa bağlantı ne zaman işe yarar"
  when:
    - t: "Mesajlar ve profiller"
      d: "Kısa bağlantı biyografide, mesajda veya açıklamada daha az yer kaplar ve üç satıra bölünmez."
    - t: "Basılı her şey"
      d: "Kısa bağlantının QR kodunda daha az ve daha büyük kareler bulunur; bu yüzden uzaktan ya da küçük etikette taratması daha kolaydır. Tasarımı matbaaya göndermeden önce <a href='[[print_guide]]'>baskı rehberimizi</a> okuyun."
    - t: "Slaytlar, videolar ve podcastler"
      d: "İnsanlar kısa bağlantıyı ekrandan yazabilir, siz de bir paragraf karakter okumadan sesli söyleyebilirsiniz."
    - t: "Karmaşık adresleri toparlamak"
      d: "Mağazalardan, haritalardan ve aramalardan kopyalanan bağlantılarda soru işaretinden sonra uzun diziler olur. Kısa bağlantı paylaşırken bu karmaşayı gizler."
  know_h: "Kullanmadan önce bilmeniz gerekenler"
  know:
    - "Kısa bağlantılar urlshort.tr üzerinde oluşturulur ve girdiğiniz adrese yönlendirir. Üyelik gerekmez."
    - "Bir bağlantı oluşturulduktan sonra düzenlenemez. Düğmeye basmadan önce adresi kontrol edin."
    - "Kısa bağlantıya sahip herkes onu açabilir. Gizli kalması gereken sayfaları kısaltmayın."
    - "Diğer kısaltma hizmetlerinin bağlantıları kabul edilmez, zararlı bağlantılar kaldırılır."
    - "Açmadan önce kısa bağlantının nereye gittiğini görebilirsiniz: bağlantının sonuna artı (+) ekleyin veya <a href='[[check]]'>bağlantı denetleyicisini</a> kullanın. <a href='[[safe_guide]]'>Kısa bağlantıları kontrol etme rehberimiz</a> daha fazlasını anlatır."
    - "Zararlı bir bağlantı mı buldunuz? <a href='[[report]]'>Bildirin</a>."
  extra:
    - h: "Her tür bağlantı için ücretsiz kısa URL oluşturucu"
      d: "Kısa URL, insanları seçtiğiniz sayfaya götüren daha kısa bir web adresidir. URL kısaltıcı; ürün sayfaları, çevrimiçi formlar, videolar, haritalar, belgeler ve etkinlik davetleri için kullanılır. Uzun adres bağlantı hizmetimizde saklanır, urlshort.tr üzerindeki kısa adres ise ziyaretçileri bir anda oraya götürür. Kurulacak ya da ödenecek bir şey yok. Gereken kadar kısa bağlantı oluşturabilirsiniz; saatlik makul bir sınır, hizmeti herkes için hızlı tutar ve otomatik kötüye kullanımı engeller."
    - h: "Kısa URL mi, uzun URL mi: hangisini paylaşmalı?"
      d: "Adres bir sayfanın içinde duracaksa uzun URL kullanın, çünkü okuyucular onu hiç görmez. İnsanlar adresi görecek, yazacak, söyleyecek ya da taratacaksa kısa URL kullanın: mesajda, slaytta, basılı broşürde, video açıklamasında veya ürün etiketinde. Kısa bağlantılar sesli söylemesi kolaydır, mesajlaşma uygulaması satırı bölünce daha az bozulur ve QR kodu sadeleştirir, çünkü daha az karakter daha büyük kareler demektir. <a href='[[print_guide]]'>QR kod boyutu ve kontrast rehberimiz</a> bunun baskıda neden önemli olduğunu anlatır."
    - h: "Kısa bağlantıdan en iyi şekilde yararlanma"
      d: "Sayfayı anlatan bir özel uzantı seçin, örneğin summer_menu veya team_survey, böylece insanlar tıklamadan önce ne bulacaklarını bilir. Paylaşmadan önce kısa bağlantıyı kendiniz deneyin ve asıl adresi güvenli bir yerde saklayın. QR kod basacaksanız önce birden fazla telefonla taratın. Giriş gerektiren ya da yakında silebileceğiniz sayfaları kısaltmaktan kaçının, çünkü kısa bağlantı yalnızca hedefte var olan şeye götürür. Başkasından kısa bağlantı aldığınızda, açmadan önce nereye gittiğini görmek için sonuna artı (+) ekleyin."
  faq_h: "Sık sorulan sorular"
  faq:
    - q: "Bu URL kısaltıcı ücretsiz mi?"
      a: "Evet. Ödenecek bir şey ve üyelik yok. Site reklamlarla desteklenir."
    - q: "Kısa bağlantıların süresi dolar mı?"
      a: "Son kullanma tarihi belirlenmez. Bir bağlantı, örneğin kötüye kullanım nedeniyle bildirilip kaldırılana kadar çalışır. Önemli şeyler için asıl adresi güvenli bir yerde saklayın."
    - q: "Kısa bağlantının gittiği yeri değiştirebilir miyim?"
      a: "Hayır. Kısa bağlantı, oluşturulduğu adrese gider. Hedef sayfa taşınırsa yeni bir kısa bağlantı oluşturup eskisinin yerine kullanın."
    - q: "Tıklamaları izliyor musunuz?"
      a: "Her kısa bağlantının kaç kez açıldığını sayar ve toplamı tıklama sayacı sayfasında gösteririz. Sayaç her bağlantı için yalnızca bir sayı saklar. IP adreslerini kaydetmez ve bağlantıyı açan kişilerin profilini çıkarmaz. Arama motoru robotları ve bağlantı önizlemeleri sayılmaz."
    - q: "Kısalttığım bağlantıları saklıyor musunuz?"
      a: "Evet, yönlendirme bu şekilde çalıştığı için adres ve kısa uzantısı bağlantı hizmetimizde saklanır. Hesap yoktur. Son bağlantılarınızın kısa bir geçmişi de tarayıcınızda tutulur ve istediğiniz zaman silebilirsiniz."
    - q: "QR kod her telefonda çalışır mı?"
      a: "Standart bir QR koddur; güncel telefon kameraları ve tarayıcı uygulamaları okur. Yazdırmadan önce kodu mutlaka telefonla deneyin ve çevresindeki beyaz boşluğu bırakın."
    - q: "QR kodu basılı materyalde veya ürünlerde kullanabilir miyim?"
      a: "Evet. Matbaa vektör dosya isterse SVG, belgeler ve ekranlar için PNG indirin. Kodun işaret ettiği sayfaya bağlantı verme hakkınız olduğundan emin olun."
qr:
  h1: "QR kod oluşturucu"
  lead: "Bir web adresi veya herhangi bir metin yazın, kod hemen belirir. Belgeler ve ekranlar için PNG, baskı için SVG olarak indirin. Yazdığınız hiçbir şey cihazınızdan çıkmaz."
  label_text: "Bağlantı veya metin"
  placeholder: "https://example.com"
  size_label: "İndirme boyutu"
  size_s: "Küçük (512 px)"
  size_m: "Orta (1024 px)"
  size_l: "Büyük (2048 px)"
  level_label: "Hata düzeltme"
  level_l: "Düşük (yaklaşık %7)"
  level_m: "Orta (yaklaşık %15)"
  level_q: "Çeyrek (yaklaşık %25)"
  level_h: "Yüksek (yaklaşık %30)"
  fg_label: "Kod rengi"
  bg_label: "Arka plan"
  empty: "QR kodunuz burada görünecek."
  qr_aria: "QR kodunuz"
  which_h: "Hangi dosyayı indirmeliyim?"
  png_t: "PNG"
  png_d: "Piksellerden oluşan bir resim. Belgelerde, slaytlarda, web sitelerinde ve mesajlarda kullanın. Basılacaksa büyük boyutu seçin."
  svg_t: "SVG"
  svg_d: "Her boyutta net kalan vektör dosya. Matbaaya bunu gönderin veya tabela ve ambalajda kullanın."
  extra:
    - h: "İnsanlar QR kodu nerede kullanıyor"
      d: "QR kod, bir web adresini telefon kamerasının okuyabileceği bir görüntüye çevirir; kimsenin bir şey yazması gerekmez. Restoranlar masa kartlarında ve menülerde, mağazalar ürün etiketlerinde ve fişlerde, etkinlik düzenleyicileri biletlerde ve afişlerde kullanır. Kartvizitlerde, broşürlerde, ambalajlarda, slaytlarda ve vitrinlerde de işe yarar. Burada üretilenler gibi statik bir kod, içindeki bağlantı çalıştığı sürece abonelik gerektirmeden çalışmaya devam eder. Hazır kodu her zaman bir telefonla, taranacağı ışıkta deneyin ve etrafında temiz bir beyaz kenarlık bırakın."
  tips_h: "Taranan bir kod için ipuçları"
  tips:
    - "Açık arka planda koyu kod en iyi taranır. Kontrastı yüksek tutun."
    - "Beyaz kenarlığı bırakın. Tarayıcıların kenarları bulmak için ona ihtiyacı var."
    - "Kısa metin daha basit kod üretir. Uzun adres için <a href='[[home]]'>önce bağlantıyı kısaltın</a>."
    - "Yüksek hata düzeltme kodun yıpranmaya dayanmasını sağlar ama kareleri küçültür."
    - "Yazdırmadan önce telefonla deneyin. <a href='[[qr_guide]]'>Boyut ve kontrast rehberimizde</a> ayrıntılar var."
  faq_h: "Sık sorulan sorular"
  faq:
    - q: "Bu QR kod oluşturucu ücretsiz mi?"
      a: "Evet. Üyelik yok, filigran yok, indirme sınırı yok."
    - q: "QR kodun süresi dolar mı?"
      a: "Hayır. Kod, karelerle çizilmiş metnin kendisidir; içindeki sayfa veya metin var olduğu sürece çalışır. Bu statik bir koddur, izlenen bir kod değil."
    - q: "Metnim bir sunucuya gönderiliyor mu?"
      a: "Hayır. Kod tarayıcınızda çizilir. Kısa bağlantı da istiyorsanız adresi bağlantı hizmetimize gönderen <a href='[[home]]'>URL kısaltıcıyı</a> kullanın."
    - q: "QR koda ne koyabilirim?"
      a: "En yaygını web adresidir ama en düşük hata düzeltmede yaklaşık 2.900 karaktere kadar her metin olur. Metnin çok uzun olduğuna dair bir uyarı görürseniz kısaltın."
    - q: "Kodu ürün veya afiş üzerine basabilir miyim?"
      a: "Evet. SVG indirin, kenarlığı koruyun ve önce basılı bir provada taramayı deneyin."
