home:
  h1: "Encurte um link. Ganhe o QR Code dele."
  lead: "Cole um endereço longo e receba um curto para copiar, compartilhar ou imprimir. O QR Code é desenhado no seu dispositivo e baixado em PNG ou SVG. Não precisa de conta."
  label_url: "Link para encurtar"
  placeholder: "https://example.com/a/very/long/page?with=parameters"
  btn_shorten: "Encurtar link"
  opt_summary: "Escolha seu próprio final (opcional)"
  opt_label: "Final personalizado"
  opt_placeholder: "my_launch_page"
  opt_hint: "De 5 a 30 letras, números ou sublinhados. Se já estiver em uso, escolha outro."
  copy: "Copiar link"
  open: "Abrir link"
  dl_png: "Baixar PNG"
  dl_svg: "Baixar SVG"
  qr_aria: "QR Code do seu link curto"
  recent_h: "Links recentes neste dispositivo"
  recent_hint: "Ficam salvos apenas neste navegador."
  recent_clear: "Limpar lista"
  how_h: "Como funciona"
  steps:
    - t: "Cole seu link"
      d: "Qualquer endereço http ou https serve, inclusive os longos com parâmetros de rastreamento."
    - t: "Encurte"
      d: "Nosso serviço guarda seu endereço e devolve um curto no urlshort.tr. Adicione seu próprio final para ficar legível."
    - t: "Copie ou escaneie"
      d: "Copie o link curto ou baixe o QR Code para um folheto, cardápio, slide ou etiqueta de produto."
  when_h: "Quando um link curto ajuda"
  when:
    - t: "Mensagens e perfis"
      d: "Um link curto ocupa menos espaço em uma bio, mensagem ou legenda e não quebra em três linhas."
    - t: "Qualquer material impresso"
      d: "O QR Code de um link curto tem menos quadrados, e maiores, do que o de um endereço longo, então é mais fácil de escanear de longe ou em uma etiqueta pequena. Leia <a href='[[print_guide]]'>nosso guia de impressão</a> antes de enviar um design para a gráfica."
    - t: "Slides, vídeos e podcasts"
      d: "As pessoas conseguem digitar um link curto a partir de uma tela, e você pode dizê-lo em voz alta sem ler um parágrafo de caracteres."
    - t: "Limpar um endereço bagunçado"
      d: "Links copiados de lojas, mapas e buscas costumam ter textos longos depois do ponto de interrogação. Um link curto esconde essa bagunça ao compartilhar."
  know_h: "O que saber antes de usar"
  know:
    - "Os links curtos são criados no urlshort.tr e redirecionam para o endereço que você digitou. Não é preciso se cadastrar."
    - "Um link não pode ser editado depois de criado. Confira o endereço antes de apertar o botão."
    - "Qualquer pessoa com um link curto pode abri-lo. Não encurte páginas que devem ser privadas."
    - "Links de outros serviços de encurtamento não são aceitos, e links nocivos são removidos."
    - "Você pode ver para onde um link curto vai antes de abrir: adicione um sinal de mais (+) ao final do link ou use <a href='[[check]]'>o verificador de links</a>. Nosso guia sobre <a href='[[safe_guide]]'>como verificar links curtos</a> explica mais."
    - "Encontrou um link nocivo? <a href='[[report]]'>Denuncie</a>."
  extra:
    - h: "Um criador de URL curta grátis para qualquer link"
      d: "Uma URL curta é apenas um endereço web mais breve que leva as pessoas à página que você escolheu. Usa-se um encurtador de URL para páginas de produto, formulários online, vídeos, mapas, documentos e convites de eventos. O endereço longo fica guardado no nosso serviço de links, e o curto do urlshort.tr leva os visitantes até ele em instantes. Não há nada para instalar nem para pagar. Você pode criar quantos links curtos precisar, dentro de um limite justo por hora que mantém o serviço rápido para todos e impede abuso automatizado."
    - h: "URL curta ou URL longa: qual compartilhar?"
      d: "Use uma URL longa quando o endereço ficar dentro de uma página, porque os leitores nunca o veem. Use uma URL curta quando as pessoas vão ver, digitar, dizer ou escanear: numa mensagem, num slide, num folheto impresso, na descrição de um vídeo ou na etiqueta de um produto. Links curtos são mais fáceis de falar em voz alta, quebram menos quando um aplicativo de mensagens divide a linha e deixam o QR Code mais simples, porque menos caracteres significam quadrados maiores. Nosso guia sobre <a href='[[print_guide]]'>tamanho e contraste do QR Code</a> explica por que isso importa na impressão."
    - h: "Como aproveitar melhor um link curto"
      d: "Escolha um final personalizado que descreva a página, como summer_menu ou team_survey, para que as pessoas saibam o que esperar antes de clicar. Teste o link curto você mesmo antes de compartilhar e guarde o endereço original em local seguro. Se for imprimir um QR Code, escaneie-o antes com mais de um celular. Evite encurtar páginas que exigem login ou que você pode apagar em breve, porque um link curto só leva ao que existe no destino. Ao receber um link curto de outra pessoa, adicione um sinal de mais (+) no final para ver para onde ele leva antes de abrir."
  faq_h: "Perguntas frequentes"
  faq:
    - q: "Este encurtador de URL é grátis?"
      a: "Sim. Não há nada a pagar nem cadastro. O site é mantido por publicidade."
    - q: "Os links curtos expiram?"
      a: "Nenhuma data de validade é definida. Um link continua funcionando até ser removido, por exemplo se for denunciado por abuso. Guarde o endereço original em local seguro quando for algo importante."
    - q: "Posso mudar o destino de um link curto?"
      a: "Não. Um link curto aponta para o endereço com o qual foi criado. Se a página de destino mudar, crie um novo link curto e substitua o antigo."
    - q: "Vocês rastreiam os cliques?"
      a: "Não. O serviço não conta cliques nem cria perfil de quem abre um link."
    - q: "Vocês guardam os links que eu encurto?"
      a: "Sim, o endereço e o final curto ficam salvos no nosso serviço de links, porque é assim que o redirecionamento funciona. Não há contas. Um pequeno histórico dos seus links recentes também fica no seu navegador, e você pode apagá-lo quando quiser."
    - q: "O QR Code funciona em todos os celulares?"
      a: "É um QR Code padrão, então as câmeras e os aplicativos atuais conseguem lê-lo. Teste sempre o código em um celular antes de imprimir e mantenha a borda branca ao redor."
    - q: "Posso usar o QR Code em material impresso ou produtos?"
      a: "Sim. Baixe o SVG se a gráfica pedir um arquivo vetorial, ou o PNG para documentos e telas. Confirme que você tem permissão para apontar para a página do código."
qr:
  h1: "Gerador de QR Code"
  lead: "Digite um endereço ou qualquer texto e o código aparece na hora. Baixe em PNG para documentos e telas, ou em SVG para impressão. Nada do que você digita sai do seu dispositivo."
  label_text: "Link ou texto"
  placeholder: "https://example.com"
  size_label: "Tamanho do download"
  size_s: "Pequeno (512 px)"
  size_m: "Médio (1024 px)"
  size_l: "Grande (2048 px)"
  level_label: "Correção de erros"
  level_l: "Baixa (cerca de 7%)"
  level_m: "Média (cerca de 15%)"
  level_q: "Quartil (cerca de 25%)"
  level_h: "Alta (cerca de 30%)"
  fg_label: "Cor do código"
  bg_label: "Fundo"
  empty: "Seu QR Code aparecerá aqui."
  qr_aria: "Seu QR Code"
  which_h: "Qual arquivo devo baixar?"
  png_t: "PNG"
  png_d: "Uma imagem feita de pixels. Use em documentos, slides, sites e mensagens. Escolha o tamanho grande se for imprimir."
  svg_t: "SVG"
  svg_d: "Um arquivo vetorial que fica nítido em qualquer tamanho. Envie à gráfica ou use em placas e embalagens."
  extra:
    - h: "Onde as pessoas usam QR Codes"
      d: "Um QR Code transforma um endereço web em uma imagem que a câmera do celular consegue ler, então ninguém precisa digitar nada. Restaurantes usam em cartões de mesa e cardápios, lojas colocam em etiquetas e recibos, e organizadores de eventos imprimem em ingressos e cartazes. Também funcionam em cartões de visita, folhetos, embalagens, slides e vitrines. Um código estático como os criados aqui continua funcionando enquanto o link dentro dele funcionar, sem assinatura. Teste sempre o código pronto com um celular, na luz em que ele será escaneado, e mantenha uma borda branca livre ao redor."
  tips_h: "Dicas para um código que escaneia"
  tips:
    - "Código escuro sobre fundo claro é o que melhor escaneia. Mantenha o contraste alto."
    - "Deixe a borda branca. Os leitores precisam dela para achar as bordas."
    - "Texto mais curto gera um código mais simples. Para um endereço longo, <a href='[[home]]'>encurte o link primeiro</a>."
    - "Mais correção de erros ajuda o código a resistir ao desgaste, mas deixa os quadrados menores."
    - "Teste com um celular antes de imprimir. Nosso <a href='[[qr_guide]]'>guia de tamanho e contraste</a> tem os detalhes."
  faq_h: "Perguntas frequentes"
  faq:
    - q: "Este gerador de QR Code é grátis?"
      a: "Sim. Sem cadastro, sem marca d'água e sem limite de downloads."
    - q: "O QR Code expira?"
      a: "Não. O código é o próprio texto desenhado em quadrados, então funciona enquanto existir a página ou o texto que ele guarda. É um código estático, sem rastreamento."
    - q: "Meu texto é enviado a um servidor?"
      a: "Não. O código é desenhado no seu navegador. Se quiser também um link curto, use o <a href='[[home]]'>encurtador de URL</a>, que envia o endereço ao nosso serviço de links."
    - q: "O que posso colocar em um QR Code?"
      a: "Um endereço da web é o mais comum, mas qualquer texto serve, até cerca de 2.900 caracteres na correção de erros mais baixa. Se aparecer um aviso de texto longo demais, encurte-o."
    - q: "Posso imprimir o código em um produto ou cartaz?"
      a: "Sim. Baixe o SVG, mantenha a borda e confira a leitura em uma prova impressa."
