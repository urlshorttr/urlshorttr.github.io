home:
  h1: "Pendekkan tautan. Dapatkan kode QR-nya."
  lead: "Tempel alamat web yang panjang dan dapatkan alamat pendek yang bisa Anda salin, bagikan, atau cetak. Kode QR digambar di perangkat Anda dan diunduh sebagai PNG atau SVG. Tanpa akun."
  label_url: "Tautan yang akan dipendekkan"
  placeholder: "https://example.com/a/very/long/page?with=parameters"
  btn_shorten: "Pendekkan tautan"
  opt_summary: "Pilih akhiran sendiri (opsional)"
  opt_label: "Akhiran khusus"
  opt_placeholder: "my_launch_page"
  opt_hint: "5 sampai 30 huruf, angka, atau garis bawah. Jika sudah dipakai, pilih yang lain."
  copy: "Salin tautan"
  open: "Buka tautan"
  dl_png: "Unduh PNG"
  dl_svg: "Unduh SVG"
  qr_aria: "Kode QR untuk tautan pendek Anda"
  recent_h: "Tautan terbaru di perangkat ini"
  recent_hint: "Hanya disimpan di browser ini."
  recent_clear: "Hapus daftar"
  how_h: "Cara kerjanya"
  steps:
    - t: "Tempel tautan Anda"
      d: "Alamat http atau https apa pun bisa, termasuk yang panjang dengan parameter pelacakan."
    - t: "Pendekkan"
      d: "Layanan tautan kami menyimpan alamat Anda dan memberi alamat pendek di urlshort.tr. Tambahkan akhiran sendiri agar mudah dibaca."
    - t: "Salin atau pindai"
      d: "Salin tautan pendek, atau unduh kode QR-nya untuk brosur, menu, slide, atau label produk."
  when_h: "Kapan tautan pendek berguna"
  when:
    - t: "Pesan dan profil"
      d: "Tautan pendek memakan ruang lebih sedikit di bio, pesan, atau keterangan, dan tidak terpotong menjadi tiga baris."
    - t: "Apa pun yang dicetak"
      d: "Kode QR untuk tautan pendek punya kotak yang lebih sedikit dan lebih besar daripada alamat panjang, sehingga lebih mudah dipindai dari jauh atau pada label kecil. Baca <a href='[[print_guide]]'>panduan cetak kami</a> sebelum mengirim desain ke percetakan."
    - t: "Slide, video, dan podcast"
      d: "Orang bisa mengetik tautan pendek dari layar, dan Anda bisa mengucapkannya tanpa membacakan paragraf karakter."
    - t: "Merapikan alamat yang berantakan"
      d: "Tautan yang disalin dari toko, peta, dan hasil pencarian sering punya rangkaian panjang setelah tanda tanya. Tautan pendek menyembunyikannya saat dibagikan."
  know_h: "Yang perlu diketahui sebelum memakai"
  know:
    - "Tautan pendek dibuat di urlshort.tr dan mengarahkan ke alamat yang Anda masukkan. Tidak perlu mendaftar."
    - "Tautan tidak bisa diubah setelah dibuat. Periksa alamatnya sebelum menekan tombol."
    - "Siapa pun yang punya tautan pendek bisa membukanya. Jangan pendekkan halaman yang harus bersifat pribadi."
    - "Tautan ke layanan pemendek lain tidak diterima, dan tautan berbahaya dihapus."
    - "Anda bisa melihat ke mana tautan pendek mengarah sebelum membukanya: tambahkan tanda plus (+) di akhir tautan, atau gunakan <a href='[[check]]'>pemeriksa tautan</a>. <a href='[[safe_guide]]'>Panduan memeriksa tautan pendek</a> kami menjelaskan lebih lanjut."
    - "Menemukan tautan berbahaya? <a href='[[report]]'>Laporkan</a>."
  faq_h: "Pertanyaan yang sering diajukan"
  faq:
    - q: "Apakah pemendek URL ini gratis?"
      a: "Ya. Tidak ada yang perlu dibayar dan tidak perlu mendaftar. Situs ini didukung oleh iklan."
    - q: "Apakah tautan pendek kedaluwarsa?"
      a: "Tidak ada tanggal kedaluwarsa. Tautan terus berfungsi sampai dihapus, misalnya karena dilaporkan menyalahgunakan layanan. Simpan alamat asli di tempat aman untuk hal penting."
    - q: "Bisakah saya mengubah tujuan tautan pendek?"
      a: "Tidak. Tautan pendek mengarah ke alamat saat tautan itu dibuat. Jika halaman tujuan pindah, buat tautan pendek baru dan gantikan yang lama."
    - q: "Apakah Anda melacak klik?"
      a: "Tidak. Layanan ini tidak menghitung klik dan tidak membuat profil orang yang membuka tautan."
    - q: "Apakah Anda menyimpan tautan yang saya pendekkan?"
      a: "Ya, alamat dan akhiran pendeknya disimpan di layanan tautan kami, karena begitulah cara pengalihan bekerja. Tidak ada akun. Riwayat singkat tautan terbaru Anda juga disimpan di browser Anda, dan bisa dihapus kapan saja."
    - q: "Apakah kode QR berfungsi di semua ponsel?"
      a: "Ini kode QR standar, jadi kamera dan aplikasi pemindai ponsel saat ini bisa membacanya. Selalu uji kode dengan ponsel sebelum mencetak dan biarkan tepi putih di sekelilingnya."
    - q: "Bisakah saya memakai kode QR pada bahan cetak atau produk?"
      a: "Bisa. Unduh SVG jika percetakan meminta berkas vektor, atau PNG untuk dokumen dan layar. Pastikan Anda berhak menautkan halaman yang dituju kode tersebut."
qr:
  h1: "Pembuat kode QR"
  lead: "Ketik alamat web atau teks apa pun dan kode langsung muncul. Unduh sebagai PNG untuk dokumen dan layar, atau SVG untuk cetak. Apa yang Anda ketik tidak keluar dari perangkat Anda."
  label_text: "Tautan atau teks"
  placeholder: "https://example.com"
  size_label: "Ukuran unduhan"
  size_s: "Kecil (512 px)"
  size_m: "Sedang (1024 px)"
  size_l: "Besar (2048 px)"
  level_label: "Koreksi kesalahan"
  level_l: "Rendah (sekitar 7%)"
  level_m: "Sedang (sekitar 15%)"
  level_q: "Kuartil (sekitar 25%)"
  level_h: "Tinggi (sekitar 30%)"
  fg_label: "Warna kode"
  bg_label: "Latar belakang"
  empty: "Kode QR Anda akan muncul di sini."
  qr_aria: "Kode QR Anda"
  which_h: "Berkas mana yang harus saya unduh?"
  png_t: "PNG"
  png_d: "Gambar yang terdiri dari piksel. Pakai di dokumen, slide, situs web, dan pesan. Pilih ukuran besar jika akan dicetak."
  svg_t: "SVG"
  svg_d: "Berkas vektor yang tetap tajam di ukuran apa pun. Kirim ini ke percetakan, atau pakai untuk papan nama dan kemasan."
  tips_h: "Tips agar kode bisa dipindai"
  tips:
    - "Kode gelap di latar terang paling mudah dipindai. Jaga kontras tetap tinggi."
    - "Biarkan tepi putih. Pemindai membutuhkannya untuk menemukan sisi kode."
    - "Teks lebih pendek menghasilkan kode lebih sederhana. Untuk alamat panjang, <a href='[[home]]'>pendekkan tautan dulu</a>."
    - "Koreksi kesalahan lebih tinggi membuat kode tahan aus, tetapi kotaknya jadi lebih kecil."
    - "Uji dengan ponsel sebelum mencetak. <a href='[[qr_guide]]'>Panduan ukuran dan kontras</a> kami punya rinciannya."
  faq_h: "Pertanyaan yang sering diajukan"
  faq:
    - q: "Apakah pembuat kode QR ini gratis?"
      a: "Ya. Tanpa pendaftaran, tanpa watermark, dan tanpa batas unduhan."
    - q: "Apakah kode QR kedaluwarsa?"
      a: "Tidak. Kode adalah teks itu sendiri yang digambar sebagai kotak, jadi berfungsi selama halaman atau teks di dalamnya ada. Ini kode statis, bukan kode yang dilacak."
    - q: "Apakah teks saya dikirim ke server?"
      a: "Tidak. Kode digambar di browser Anda. Jika Anda juga ingin tautan pendek, gunakan <a href='[[home]]'>pemendek URL</a>, yang mengirim alamat ke layanan tautan kami."
    - q: "Apa yang bisa dimasukkan ke kode QR?"
      a: "Alamat web paling umum, tetapi teks apa pun bisa, hingga sekitar 2.900 karakter pada koreksi kesalahan terendah. Jika muncul pesan teks terlalu panjang, pendekkan teksnya."
    - q: "Bisakah saya mencetak kode di produk atau poster?"
      a: "Bisa. Unduh SVG, pertahankan tepinya, dan periksa pemindaian pada contoh cetak terlebih dahulu."
check:
  h1: "Cek ke mana tautan pendek mengarah"
  lead: "Tempel tautan pendek dari situs ini. Anda akan melihat alamat lengkapnya lebih dulu dan bisa memutuskan untuk melanjutkan atau tidak."
  label: "Tautan pendek"
  placeholder: "urlshort.tr/abc123"
  btn: "Cek tautan"
  other_h: "Cara lain untuk memeriksa"
  other:
    - "Tambahkan tanda plus (+) di akhir tautan pendek mana pun dari situs ini lalu buka. Anda mendapat halaman pratinjau yang sama."
    - "Alat ini hanya untuk tautan yang dibuat di situs ini. Untuk layanan lain, cari opsi pratinjau mereka sendiri."
    - "Baca panduan kami tentang <a href='[[safe_guide]]'>cara mengetahui apakah tautan pendek aman</a>."
    - "Menemukan tautan berbahaya? <a href='[[report]]'>Laporkan</a>."
