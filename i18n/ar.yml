home:
  h1: "اختصر رابطًا. واحصل على رمز QR له."
  lead: "الصق عنوان ويب طويلًا لتحصل على عنوان قصير يمكنك نسخه أو مشاركته أو طباعته. يُرسم رمز QR على جهازك ويُنزَّل بصيغة PNG أو SVG. لا حاجة إلى حساب."
  label_url: "الرابط المراد اختصاره"
  placeholder: "https://example.com/a/very/long/page?with=parameters"
  btn_shorten: "اختصر الرابط"
  opt_summary: "اختر نهاية خاصة بك (اختياري)"
  opt_label: "نهاية مخصّصة"
  opt_placeholder: "my_launch_page"
  opt_hint: "من 5 إلى 30 حرفًا أو رقمًا أو شرطة سفلية. إذا كانت مستخدمة مسبقًا فاختر غيرها."
  copy: "انسخ الرابط"
  open: "افتح الرابط"
  dl_png: "تنزيل PNG"
  dl_svg: "تنزيل SVG"
  qr_aria: "رمز QR لرابطك المختصر"
  recent_h: "الروابط الأخيرة على هذا الجهاز"
  recent_hint: "تُحفظ في هذا المتصفح فقط."
  recent_clear: "مسح القائمة"
  how_h: "كيف يعمل"
  steps:
    - t: "الصق رابطك"
      d: "يصلح أي عنوان http أو https، حتى الطويل المليء بمعاملات التتبع."
    - t: "اختصره"
      d: "تحفظ خدمة الروابط لدينا عنوانك وتعيد لك عنوانًا قصيرًا على urlshort.tr. أضف نهاية خاصة بك إن أردته مقروءًا."
    - t: "انسخ أو امسح"
      d: "انسخ الرابط المختصر، أو نزّل رمز QR الخاص به لنشرة أو قائمة طعام أو شريحة عرض أو ملصق منتج."
  when_h: "متى يفيد الرابط المختصر"
  when:
    - t: "الرسائل والملفات الشخصية"
      d: "يأخذ الرابط المختصر مساحة أقل في النبذة أو الرسالة أو التعليق، ولا يتكسّر على ثلاثة أسطر."
    - t: "كل ما يُطبع"
      d: "رمز QR للرابط المختصر يحتوي مربعات أقل وأكبر من رمز العنوان الطويل، فيسهل مسحه من بعيد أو على ملصق صغير. اقرأ <a href='[[print_guide]]'>دليل الطباعة</a> قبل إرسال التصميم إلى المطبعة."
    - t: "الشرائح ومقاطع الفيديو والبودكاست"
      d: "يستطيع الناس كتابة الرابط المختصر من الشاشة، ويمكنك نطقه بصوت عالٍ دون قراءة فقرة من الرموز."
    - t: "تنظيف العناوين المعقّدة"
      d: "الروابط المنسوخة من المتاجر والخرائط ونتائج البحث كثيرًا ما تحمل سلاسل طويلة بعد علامة الاستفهام. يخفي الرابط المختصر هذه الفوضى عند المشاركة."
  know_h: "ما يجب معرفته قبل الاستخدام"
  know:
    - "تُنشأ الروابط المختصرة على urlshort.tr وتعيد التوجيه إلى العنوان الذي أدخلته. لا حاجة إلى التسجيل."
    - "لا يمكن تعديل الرابط بعد إنشائه. تحقق من العنوان قبل الضغط على الزر."
    - "يستطيع أي شخص يملك الرابط المختصر فتحه. لا تختصر الصفحات التي يجب أن تبقى خاصة."
    - "لا تُقبل روابط خدمات الاختصار الأخرى، وتُزال الروابط الضارة."
    - "يمكنك معرفة وجهة الرابط المختصر قبل فتحه: أضف علامة الجمع (+) في نهاية الرابط، أو استخدم <a href='[[check]]'>أداة فحص الروابط</a>. يشرح <a href='[[safe_guide]]'>دليل فحص الروابط المختصرة</a> المزيد."
    - "وجدت رابطًا ضارًا؟ <a href='[[report]]'>أبلغ عنه</a>."
  extra:
    - h: "منشئ روابط قصيرة مجاني لأي رابط"
      d: "الرابط القصير هو ببساطة عنوان ويب أقصر يوصل الناس إلى الصفحة التي اخترتها. يُستخدم مُختصِر الروابط لصفحات المنتجات والنماذج الإلكترونية ومقاطع الفيديو والخرائط والمستندات ودعوات الفعاليات. يُحفظ العنوان الطويل في خدمة الروابط لدينا، ويوصل العنوان القصير على urlshort.tr الزوّار إليه في لحظات. لا شيء لتثبيته ولا شيء لتدفعه. يمكنك إنشاء ما تحتاجه من الروابط القصيرة ضمن حد معقول في الساعة يُبقي الخدمة سريعة للجميع ويمنع الإساءة الآلية."
    - h: "رابط قصير أم رابط طويل: أيهما تشارك؟"
      d: "استخدم الرابط الطويل حين يكون العنوان داخل صفحة، لأن القرّاء لا يرونه أبدًا. واستخدم الرابط القصير حين سيراه الناس أو يكتبونه أو ينطقونه أو يمسحونه: في رسالة، أو شريحة عرض، أو نشرة مطبوعة، أو وصف فيديو، أو ملصق منتج. الروابط القصيرة أسهل نطقًا، وأقل عرضة للتكسّر حين يقسم تطبيق المراسلة السطر، وتجعل رمز QR أبسط، لأن الحروف الأقل تعني مربعات أكبر. يشرح <a href='[[print_guide]]'>دليل حجم رمز QR وتباينه</a> لماذا يهم ذلك في الطباعة."
    - h: "كيف تستفيد أكثر من الرابط القصير"
      d: "اختر نهاية مخصّصة تصف الصفحة، مثل summer_menu أو team_survey، ليعرف الناس ما ينتظرهم قبل النقر. جرّب الرابط القصير بنفسك قبل مشاركته واحتفظ بالعنوان الأصلي في مكان آمن. إذا كنت ستطبع رمز QR فامسحه أولًا بأكثر من هاتف. تجنّب اختصار صفحات تتطلب تسجيل الدخول أو قد تحذفها قريبًا، لأن الرابط القصير لا يقود إلا إلى ما هو موجود في الوجهة. وعندما تصلك رابط قصير من شخص آخر، أضف علامة الجمع (+) في نهايته لترى إلى أين يقود قبل أن تفتحه."
  faq_h: "الأسئلة الشائعة"
  faq:
    - q: "هل مُختصِر الروابط هذا مجاني؟"
      a: "نعم. لا شيء تدفعه ولا تسجيل. الموقع مدعوم بالإعلانات."
    - q: "هل تنتهي صلاحية الروابط المختصرة؟"
      a: "لا يُحدَّد تاريخ انتهاء. يستمر الرابط في العمل حتى تتم إزالته، مثلًا إذا أُبلغ عنه بسبب إساءة الاستخدام. احتفظ بالعنوان الأصلي في مكان آمن للأمور المهمة."
    - q: "هل يمكنني تغيير وجهة الرابط المختصر؟"
      a: "لا. يشير الرابط المختصر إلى العنوان الذي أُنشئ به. إذا انتقلت صفحة الوجهة فأنشئ رابطًا مختصرًا جديدًا واستبدل القديم."
    - q: "هل تتتبعون النقرات؟"
      a: "نحسب عدد مرات فتح كل رابط قصير ونعرض المجموع في صفحة عدّاد النقرات. يحفظ العدّاد رقمًا واحدًا فقط لكل رابط. لا يحفظ عناوين IP ولا يبني ملفًا تعريفيًا لمن يفتحون الرابط. لا تُحسب روبوتات محركات البحث ولا معاينات الروابط."
    - q: "هل تحفظون الروابط التي أختصرها؟"
      a: "نعم، يُحفظ العنوان ونهايته المختصرة في خدمة الروابط لدينا لأن إعادة التوجيه تعمل بهذه الطريقة. لا توجد حسابات. كما يُحفظ في متصفحك سجل قصير بروابطك الأخيرة ويمكنك مسحه في أي وقت."
    - q: "هل يعمل رمز QR على كل الهواتف؟"
      a: "هو رمز QR قياسي، لذا تقرؤه كاميرات الهواتف وتطبيقات المسح الحالية. اختبر الرمز دائمًا بهاتف قبل الطباعة واترك الإطار الأبيض حوله."
    - q: "هل يمكنني استخدام رمز QR على المطبوعات أو المنتجات؟"
      a: "نعم. نزّل SVG إذا طلبت المطبعة ملفًا متجهيًا، أو PNG للمستندات والشاشات. تأكد من أن لديك الحق في الإشارة إلى الصفحة التي يقود إليها الرمز."
qr:
  h1: "مولّد رمز QR"
  lead: "اكتب عنوان ويب أو أي نص فيظهر الرمز فورًا. نزّله بصيغة PNG للمستندات والشاشات، أو SVG للطباعة. لا يغادر ما تكتبه جهازك."
  label_text: "رابط أو نص"
  placeholder: "https://example.com"
  size_label: "حجم التنزيل"
  size_s: "صغير (512 px)"
  size_m: "متوسط (1024 px)"
  size_l: "كبير (2048 px)"
  level_label: "تصحيح الأخطاء"
  level_l: "منخفض (نحو 7%)"
  level_m: "متوسط (نحو 15%)"
  level_q: "ربعي (نحو 25%)"
  level_h: "عالٍ (نحو 30%)"
  fg_label: "لون الرمز"
  bg_label: "الخلفية"
  empty: "سيظهر رمز QR الخاص بك هنا."
  qr_aria: "رمز QR الخاص بك"
  which_h: "أي ملف أنزّل؟"
  png_t: "PNG"
  png_d: "صورة مكوّنة من بكسلات. استخدمها في المستندات والعروض والمواقع والرسائل. اختر الحجم الكبير إن كانت ستُطبع."
  svg_t: "SVG"
  svg_d: "ملف متجهي يبقى واضحًا بأي حجم. أرسله إلى المطبعة أو استخدمه للافتات والتغليف."
  extra:
    - h: "أين يستخدم الناس رموز QR"
      d: "يحوّل رمز QR عنوان الويب إلى صورة تستطيع كاميرا الهاتف قراءتها، فلا يحتاج أحد إلى كتابة شيء. تستخدمه المطاعم على بطاقات الطاولات وقوائم الطعام، وتضعه المتاجر على ملصقات المنتجات والإيصالات، ويطبعه منظمو الفعاليات على التذاكر والملصقات. وهو مفيد أيضًا على بطاقات الأعمال والنشرات والتغليف وشرائح العرض وواجهات المحال. الرمز الثابت مثل الذي يُنشأ هنا يستمر في العمل ما دام الرابط بداخله يعمل، دون اشتراك. جرّب الرمز النهائي دائمًا بهاتف، في الإضاءة التي سيُمسح فيها، واترك حوله إطارًا أبيض نظيفًا."
  tips_h: "نصائح لرمز يُمسح بسهولة"
  tips:
    - "الرمز الداكن على خلفية فاتحة هو الأسهل في المسح. حافظ على تباين عالٍ."
    - "اترك الإطار الأبيض. يحتاجه الماسح لتحديد الحواف."
    - "النص الأقصر يعطي رمزًا أبسط. للعنوان الطويل، <a href='[[home]]'>اختصر الرابط أولًا</a>."
    - "تصحيح الأخطاء الأعلى يساعد الرمز على تحمّل التلف لكنه يجعل المربعات أصغر."
    - "اختبر بهاتف قبل الطباعة. في <a href='[[qr_guide]]'>دليل الحجم والتباين</a> التفاصيل."
  faq_h: "الأسئلة الشائعة"
  faq:
    - q: "هل مولّد رمز QR هذا مجاني؟"
      a: "نعم. بلا تسجيل وبلا علامة مائية وبلا حد للتنزيلات."
    - q: "هل تنتهي صلاحية رمز QR؟"
      a: "لا. الرمز هو النص نفسه مرسومًا على شكل مربعات، فيعمل ما دامت الصفحة أو النص الذي يحمله موجودين. هذا رمز ثابت وليس رمزًا يتم تتبعه."
    - q: "هل يُرسل نصي إلى خادم؟"
      a: "لا. يُرسم الرمز في متصفحك. إن أردت رابطًا مختصرًا أيضًا فاستخدم <a href='[[home]]'>مُختصِر الروابط</a> الذي يرسل العنوان إلى خدمة الروابط لدينا."
    - q: "ماذا يمكنني وضعه في رمز QR؟"
      a: "عنوان الويب هو الأكثر شيوعًا، لكن أي نص يصلح، حتى نحو 2900 حرف عند أدنى مستوى لتصحيح الأخطاء. إذا ظهرت رسالة بأن النص طويل جدًا فاختصره."
    - q: "هل يمكنني طباعة الرمز على منتج أو ملصق؟"
      a: "نعم. نزّل SVG، واحتفظ بالإطار، وتحقق من المسح على نسخة مطبوعة تجريبية أولًا."
