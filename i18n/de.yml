home:
  h1: "Link kürzen. QR-Code dazu erhalten."
  lead: "Fügen Sie eine lange Webadresse ein und erhalten Sie eine kurze, die Sie kopieren, teilen oder drucken können. Der QR-Code wird auf Ihrem Gerät gezeichnet und als PNG oder SVG heruntergeladen. Ein Konto ist nicht nötig."
  label_url: "Zu kürzender Link"
  placeholder: "https://example.com/a/very/long/page?with=parameters"
  btn_shorten: "Link kürzen"
  opt_summary: "Eigenes Ende wählen (optional)"
  opt_label: "Eigenes Ende"
  opt_placeholder: "my_launch_page"
  opt_hint: "5 bis 30 Buchstaben, Ziffern oder Unterstriche. Ist es schon vergeben, wählen Sie ein anderes."
  copy: "Link kopieren"
  open: "Link öffnen"
  dl_png: "PNG herunterladen"
  dl_svg: "SVG herunterladen"
  qr_aria: "QR-Code für Ihren Kurzlink"
  recent_h: "Letzte Links auf diesem Gerät"
  recent_hint: "Sie werden nur in diesem Browser gespeichert."
  recent_clear: "Liste löschen"
  how_h: "So funktioniert es"
  steps:
    - t: "Link einfügen"
      d: "Jede http- oder https-Adresse funktioniert, auch lange mit Tracking-Parametern."
    - t: "Kürzen"
      d: "Unser Link-Dienst speichert Ihre Adresse und gibt eine kurze auf urlshort.tr zurück. Fügen Sie ein eigenes Ende hinzu, wenn sie gut lesbar sein soll."
    - t: "Kopieren oder scannen"
      d: "Kopieren Sie den Kurzlink oder laden Sie seinen QR-Code für Flyer, Speisekarte, Folie oder Produktetikett herunter."
  when_h: "Wann ein Kurzlink hilft"
  when:
    - t: "Nachrichten und Profile"
      d: "Ein Kurzlink braucht weniger Platz in einer Bio, einer Nachricht oder einer Bildunterschrift und bricht nicht über drei Zeilen um."
    - t: "Alles Gedruckte"
      d: "Der QR-Code eines Kurzlinks hat weniger und größere Quadrate als der einer langen Adresse und lässt sich deshalb aus der Ferne oder auf kleinen Etiketten leichter scannen. Lesen Sie <a href='[[print_guide]]'>unseren Druckratgeber</a>, bevor Sie ein Layout an die Druckerei schicken."
    - t: "Folien, Videos und Podcasts"
      d: "Man kann einen Kurzlink von einem Bildschirm abtippen, und Sie können ihn laut sagen, ohne einen Absatz voller Zeichen vorzulesen."
    - t: "Unübersichtliche Adressen aufräumen"
      d: "Aus Shops, Karten und Suchergebnissen kopierte Links tragen oft lange Zeichenfolgen hinter dem Fragezeichen. Ein Kurzlink verbirgt dieses Durcheinander beim Teilen."
  know_h: "Was Sie vor der Nutzung wissen sollten"
  know:
    - "Kurzlinks werden auf urlshort.tr erstellt und leiten zu der Adresse weiter, die Sie eingegeben haben. Eine Anmeldung ist nicht nötig."
    - "Ein Link lässt sich nach dem Erstellen nicht mehr ändern. Prüfen Sie die Adresse, bevor Sie auf die Schaltfläche drücken."
    - "Jeder, der einen Kurzlink hat, kann ihn öffnen. Kürzen Sie keine Seiten, die privat bleiben sollen."
    - "Links zu anderen Kürzungsdiensten werden nicht akzeptiert, und schädliche Links werden entfernt."
    - "Sie können sehen, wohin ein Kurzlink führt, bevor Sie ihn öffnen: Hängen Sie ein Pluszeichen (+) an das Ende des Links oder nutzen Sie <a href='[[check]]'>den Link-Prüfer</a>. Unser Ratgeber zum <a href='[[safe_guide]]'>Prüfen von Kurzlinks</a> erklärt mehr."
    - "Schädlichen Link gefunden? <a href='[[report]]'>Melden Sie ihn</a>."
  extra:
    - h: "Ein kostenloser Kurz-URL-Generator für jeden Link"
      d: "Eine Kurz-URL ist einfach eine kürzere Webadresse, die Menschen zu der Seite führt, die Sie gewählt haben. Ein URL-Kürzer wird für Produktseiten, Online-Formulare, Videos, Karten, Dokumente und Einladungen zu Veranstaltungen genutzt. Die lange Adresse wird in unserem Link-Dienst gespeichert, und die kurze auf urlshort.tr führt Besucher im Nu dorthin. Es gibt nichts zu installieren und nichts zu bezahlen. Sie können so viele Kurzlinks erstellen, wie Sie brauchen, innerhalb eines fairen Stundenlimits, das den Dienst für alle schnell hält und automatisierten Missbrauch verhindert."
    - h: "Kurze oder lange URL: Welche sollten Sie teilen?"
      d: "Verwenden Sie eine lange URL, wenn die Adresse in einer Seite steckt, denn Leser sehen sie nie. Verwenden Sie eine kurze URL, wenn Menschen sie sehen, abtippen, aussprechen oder scannen: in einer Nachricht, auf einer Folie, auf einem gedruckten Flyer, in einer Videobeschreibung oder auf einem Produktetikett. Kurze Links lassen sich leichter vorlesen, brechen seltener, wenn eine Messenger-App die Zeile umbricht, und machen den QR-Code einfacher, weil weniger Zeichen größere Quadrate bedeuten. Unser Ratgeber zu <a href='[[print_guide]]'>Größe und Kontrast von QR-Codes</a> erklärt, warum das beim Druck wichtig ist."
    - h: "So holen Sie mehr aus einem Kurzlink heraus"
      d: "Wählen Sie ein eigenes Ende, das die Seite beschreibt, etwa summer_menu oder team_survey, damit die Leute vor dem Klick wissen, was sie erwartet. Testen Sie den Kurzlink selbst, bevor Sie ihn teilen, und bewahren Sie die ursprüngliche Adresse sicher auf. Wenn Sie einen QR-Code drucken, scannen Sie ihn vorher mit mehr als einem Handy. Kürzen Sie keine Seiten, die eine Anmeldung brauchen oder die Sie bald löschen könnten, denn ein Kurzlink führt nur zu dem, was am Ziel existiert. Wenn Sie von jemand anderem einen Kurzlink erhalten, hängen Sie ein Pluszeichen (+) an, um zu sehen, wohin er führt, bevor Sie ihn öffnen."
  faq_h: "Häufig gestellte Fragen"
  faq:
    - q: "Ist dieser URL-Kürzer kostenlos?"
      a: "Ja. Es fällt nichts an und eine Anmeldung gibt es nicht. Die Website finanziert sich durch Werbung."
    - q: "Laufen Kurzlinks ab?"
      a: "Es wird kein Ablaufdatum festgelegt. Ein Link funktioniert, bis er entfernt wird, zum Beispiel nach einer Missbrauchsmeldung. Bewahren Sie die ursprüngliche Adresse bei wichtigen Dingen sicher auf."
    - q: "Kann ich das Ziel eines Kurzlinks ändern?"
      a: "Nein. Ein Kurzlink zeigt auf die Adresse, mit der er erstellt wurde. Zieht die Zielseite um, erstellen Sie einen neuen Kurzlink und ersetzen Sie den alten."
    - q: "Verfolgen Sie Klicks?"
      a: "Nein. Der Dienst zählt keine Klicks und erstellt keine Profile der Personen, die einen Link öffnen."
    - q: "Speichern Sie die Links, die ich kürze?"
      a: "Ja, die Adresse und ihr kurzes Ende werden in unserem Link-Dienst gespeichert, denn so funktioniert die Weiterleitung. Es gibt keine Konten. Ein kurzer Verlauf Ihrer letzten Links liegt außerdem in Ihrem eigenen Browser und lässt sich jederzeit löschen."
    - q: "Funktioniert der QR-Code auf jedem Handy?"
      a: "Es ist ein Standard-QR-Code, den aktuelle Handykameras und Scanner-Apps lesen. Testen Sie einen Code immer mit einem Handy, bevor Sie drucken, und lassen Sie den weißen Rand stehen."
    - q: "Kann ich den QR-Code auf Drucksachen oder Produkten verwenden?"
      a: "Ja. Laden Sie das SVG herunter, wenn die Druckerei eine Vektordatei verlangt, oder das PNG für Dokumente und Bildschirme. Stellen Sie sicher, dass Sie auf die Seite verlinken dürfen, auf die der Code zeigt."
qr:
  h1: "QR-Code-Generator"
  lead: "Geben Sie eine Webadresse oder einen beliebigen Text ein, und der Code erscheint sofort. Laden Sie ihn als PNG für Dokumente und Bildschirme oder als SVG für den Druck herunter. Nichts, was Sie eingeben, verlässt Ihr Gerät."
  label_text: "Link oder Text"
  placeholder: "https://example.com"
  size_label: "Download-Größe"
  size_s: "Klein (512 px)"
  size_m: "Mittel (1024 px)"
  size_l: "Groß (2048 px)"
  level_label: "Fehlerkorrektur"
  level_l: "Niedrig (etwa 7 %)"
  level_m: "Mittel (etwa 15 %)"
  level_q: "Quartil (etwa 25 %)"
  level_h: "Hoch (etwa 30 %)"
  fg_label: "Codefarbe"
  bg_label: "Hintergrund"
  empty: "Ihr QR-Code erscheint hier."
  qr_aria: "Ihr QR-Code"
  which_h: "Welche Datei soll ich herunterladen?"
  png_t: "PNG"
  png_d: "Ein Bild aus Pixeln. Verwenden Sie es in Dokumenten, Folien, Websites und Nachrichten. Wählen Sie die große Größe, wenn gedruckt wird."
  svg_t: "SVG"
  svg_d: "Eine Vektordatei, die in jeder Größe scharf bleibt. Schicken Sie diese an die Druckerei oder nutzen Sie sie für Schilder und Verpackungen."
  extra:
    - h: "Wo Menschen QR-Codes einsetzen"
      d: "Ein QR-Code verwandelt eine Webadresse in ein Bild, das eine Handykamera lesen kann, sodass niemand etwas eintippen muss. Restaurants nutzen ihn auf Tischkarten und Speisekarten, Geschäfte bringen ihn auf Produktetiketten und Kassenbons an, und Veranstalter drucken ihn auf Tickets und Plakate. Auch auf Visitenkarten, Broschüren, Verpackungen, Folien und Schaufenstern ist er nützlich. Ein statischer Code wie die hier erstellten funktioniert, solange der enthaltene Link funktioniert, ganz ohne Abonnement. Testen Sie den fertigen Code immer mit einem Handy, in dem Licht, in dem er gescannt wird, und lassen Sie rundherum einen freien weißen Rand."
  tips_h: "Tipps für einen scanbaren Code"
  tips:
    - "Dunkler Code auf hellem Hintergrund lässt sich am besten scannen. Halten Sie den Kontrast hoch."
    - "Lassen Sie den weißen Rand stehen. Scanner brauchen ihn, um die Ränder zu finden."
    - "Kürzerer Text ergibt einen einfacheren Code. Bei einer langen Adresse <a href='[[home]]'>kürzen Sie zuerst den Link</a>."
    - "Höhere Fehlerkorrektur hilft dem Code, Abnutzung zu überstehen, macht die Quadrate aber kleiner."
    - "Testen Sie vor dem Druck mit einem Handy. Unser <a href='[[qr_guide]]'>Ratgeber zu Größe und Kontrast</a> enthält die Einzelheiten."
  faq_h: "Häufig gestellte Fragen"
  faq:
    - q: "Ist dieser QR-Code-Generator kostenlos?"
      a: "Ja. Ohne Anmeldung, ohne Wasserzeichen und ohne Begrenzung der Downloads."
    - q: "Läuft der QR-Code ab?"
      a: "Nein. Der Code ist der Text selbst, als Quadrate gezeichnet, und funktioniert, solange die enthaltene Seite oder der Text existiert. Es ist ein statischer Code, kein verfolgter."
    - q: "Wird mein Text an einen Server gesendet?"
      a: "Nein. Der Code wird in Ihrem Browser gezeichnet. Wenn Sie zusätzlich einen Kurzlink möchten, nutzen Sie den <a href='[[home]]'>URL-Kürzer</a>, der die Adresse an unseren Link-Dienst sendet."
    - q: "Was kann ich in einen QR-Code packen?"
      a: "Am häufigsten ist eine Webadresse, aber jeder Text funktioniert, bis zu etwa 2.900 Zeichen bei der niedrigsten Fehlerkorrektur. Erscheint die Meldung, der Text sei zu lang, kürzen Sie ihn."
    - q: "Kann ich den Code auf ein Produkt oder Plakat drucken?"
      a: "Ja. Laden Sie das SVG herunter, behalten Sie den Rand und prüfen Sie den Scan zuerst an einem Probedruck."
