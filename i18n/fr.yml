home:
  h1: "Raccourcissez un lien. Obtenez son QR code."
  lead: "Collez une longue adresse web et obtenez une adresse courte à copier, partager ou imprimer. Le QR code est dessiné sur votre appareil et se télécharge en PNG ou SVG. Aucun compte requis."
  label_url: "Lien à raccourcir"
  placeholder: "https://example.com/a/very/long/page?with=parameters"
  btn_shorten: "Raccourcir le lien"
  opt_summary: "Choisissez votre propre fin (facultatif)"
  opt_label: "Fin personnalisée"
  opt_placeholder: "my_launch_page"
  opt_hint: "De 5 à 30 lettres, chiffres ou tirets bas. Si elle est déjà prise, choisissez-en une autre."
  copy: "Copier le lien"
  open: "Ouvrir le lien"
  dl_png: "Télécharger le PNG"
  dl_svg: "Télécharger le SVG"
  qr_aria: "QR code de votre lien court"
  recent_h: "Liens récents sur cet appareil"
  recent_hint: "Ils ne sont enregistrés que dans ce navigateur."
  recent_clear: "Effacer la liste"
  how_h: "Comment ça marche"
  steps:
    - t: "Collez votre lien"
      d: "Toute adresse http ou https convient, même les longues pleines de paramètres de suivi."
    - t: "Raccourcissez-le"
      d: "Notre service enregistre votre adresse et renvoie une adresse courte sur urlshort.tr. Ajoutez votre propre fin pour la rendre lisible."
    - t: "Copiez ou scannez"
      d: "Copiez le lien court, ou téléchargez son QR code pour un flyer, un menu, une diapositive ou une étiquette de produit."
  when_h: "Quand un lien court est utile"
  when:
    - t: "Messages et profils"
      d: "Un lien court prend moins de place dans une bio, un SMS ou une légende, et ne se coupe pas sur trois lignes."
    - t: "Tout ce qui s'imprime"
      d: "Le QR code d'un lien court a des carrés moins nombreux et plus grands que celui d'une longue adresse, il se scanne donc mieux de loin ou sur une petite étiquette. Lisez <a href='[[print_guide]]'>notre guide d'impression</a> avant d'envoyer un visuel à l'imprimeur."
    - t: "Diapositives, vidéos et podcasts"
      d: "On peut taper un lien court depuis un écran, et vous pouvez le dire à voix haute sans lire un paragraphe de caractères."
    - t: "Nettoyer une adresse brouillonne"
      d: "Les liens copiés depuis des boutiques, des cartes et des recherches portent souvent de longues chaînes après le point d'interrogation. Un lien court cache ce fouillis quand vous le partagez."
  know_h: "À savoir avant de l'utiliser"
  know:
    - "Les liens courts sont créés sur urlshort.tr et redirigent vers l'adresse que vous avez saisie. Aucune inscription n'est nécessaire."
    - "Un lien ne peut pas être modifié une fois créé. Vérifiez l'adresse avant d'appuyer sur le bouton."
    - "Toute personne qui possède un lien court peut l'ouvrir. Ne raccourcissez pas des pages censées rester privées."
    - "Les liens vers d'autres services de raccourcissement ne sont pas acceptés, et les liens nuisibles sont supprimés."
    - "Vous pouvez voir où mène un lien court avant de l'ouvrir : ajoutez un signe plus (+) à la fin du lien, ou utilisez <a href='[[check]]'>le vérificateur de liens</a>. Notre guide sur <a href='[[safe_guide]]'>la vérification des liens courts</a> en dit plus."
    - "Vous avez trouvé un lien nuisible ? <a href='[[report]]'>Signalez-le</a>."
  extra:
    - h: "Un créateur d'URL courtes gratuit pour tous vos liens"
      d: "Une URL courte est simplement une adresse web plus brève qui mène les gens vers la page que vous avez choisie. On utilise un raccourcisseur d'URL pour des pages de produits, des formulaires en ligne, des vidéos, des cartes, des documents et des invitations à des événements. L'adresse longue est conservée sur notre service de liens, et l'adresse courte d'urlshort.tr y conduit les visiteurs en un instant. Il n'y a rien à installer ni à payer. Vous pouvez créer autant de liens courts que nécessaire, dans une limite horaire raisonnable qui garde le service rapide pour tous et freine les abus automatisés."
    - h: "URL courte ou URL longue : laquelle partager ?"
      d: "Utilisez une URL longue quand l'adresse se trouve à l'intérieur d'une page, car les lecteurs ne la voient jamais. Utilisez une URL courte quand les gens vont la voir, la taper, la dire ou la scanner : dans un message, sur une diapositive, sur un flyer imprimé, dans la description d'une vidéo ou sur une étiquette de produit. Les liens courts se disent plus facilement à voix haute, se cassent moins quand une messagerie coupe la ligne et simplifient le QR code, car moins de caractères signifie des carrés plus grands. Notre guide sur la <a href='[[print_guide]]'>taille et le contraste du QR code</a> explique pourquoi c'est important à l'impression."
    - h: "Tirer le meilleur d'un lien court"
      d: "Choisissez une fin personnalisée qui décrit la page, comme summer_menu ou team_survey, pour que les gens sachent à quoi s'attendre avant de cliquer. Testez le lien court vous-même avant de le partager et gardez l'adresse d'origine en lieu sûr. Si vous imprimez un QR code, scannez-le d'abord avec plusieurs téléphones. Évitez de raccourcir des pages qui demandent une connexion ou que vous risquez de supprimer bientôt, car un lien court ne mène qu'à ce qui existe à la destination. Quand quelqu'un vous envoie un lien court, ajoutez un signe plus (+) à la fin pour voir où il mène avant de l'ouvrir."
  faq_h: "Questions fréquentes"
  faq:
    - q: "Ce raccourcisseur d'URL est-il gratuit ?"
      a: "Oui. Il n'y a rien à payer et pas d'inscription. Le site est financé par la publicité."
    - q: "Les liens courts expirent-ils ?"
      a: "Aucune date d'expiration n'est fixée. Un lien continue de fonctionner jusqu'à sa suppression, par exemple s'il est signalé pour abus. Conservez l'adresse d'origine en lieu sûr pour tout ce qui est important."
    - q: "Puis-je changer la destination d'un lien court ?"
      a: "Non. Un lien court pointe vers l'adresse avec laquelle il a été créé. Si la page de destination change, créez un nouveau lien court et remplacez l'ancien."
    - q: "Suivez-vous les clics ?"
      a: "Non. Le service ne compte pas les clics et ne crée pas de profil des personnes qui ouvrent un lien."
    - q: "Conservez-vous les liens que je raccourcis ?"
      a: "Oui, l'adresse et sa fin courte sont enregistrées sur notre service de liens, car c'est ainsi que fonctionne la redirection. Il n'y a pas de comptes. Un court historique de vos liens récents est aussi conservé dans votre navigateur, et vous pouvez l'effacer à tout moment."
    - q: "Le QR code fonctionnera-t-il sur tous les téléphones ?"
      a: "C'est un QR code standard : les appareils photo et applications de scan actuels le lisent. Testez toujours un code avec un téléphone avant d'imprimer et laissez la marge blanche autour."
    - q: "Puis-je utiliser le QR code sur des imprimés ou des produits ?"
      a: "Oui. Téléchargez le SVG si l'imprimeur demande un fichier vectoriel, ou le PNG pour les documents et les écrans. Assurez-vous d'avoir le droit de renvoyer vers la page ciblée par le code."
qr:
  h1: "Générateur de QR code"
  lead: "Saisissez une adresse web ou un texte et le code apparaît aussitôt. Téléchargez-le en PNG pour les documents et les écrans, ou en SVG pour l'impression. Rien de ce que vous saisissez ne quitte votre appareil."
  label_text: "Lien ou texte"
  placeholder: "https://example.com"
  size_label: "Taille du téléchargement"
  size_s: "Petite (512 px)"
  size_m: "Moyenne (1024 px)"
  size_l: "Grande (2048 px)"
  level_label: "Correction d'erreurs"
  level_l: "Faible (environ 7 %)"
  level_m: "Moyenne (environ 15 %)"
  level_q: "Quartile (environ 25 %)"
  level_h: "Élevée (environ 30 %)"
  fg_label: "Couleur du code"
  bg_label: "Arrière-plan"
  empty: "Votre QR code apparaîtra ici."
  qr_aria: "Votre QR code"
  which_h: "Quel fichier télécharger ?"
  png_t: "PNG"
  png_d: "Une image faite de pixels. Utilisez-la dans des documents, des diapositives, des sites web et des messages. Choisissez la grande taille pour l'impression."
  svg_t: "SVG"
  svg_d: "Un fichier vectoriel qui reste net à toutes les tailles. Envoyez-le à l'imprimeur, ou utilisez-le pour des panneaux et des emballages."
  extra:
    - h: "Où les gens utilisent les QR codes"
      d: "Un QR code transforme une adresse web en image que l'appareil photo d'un téléphone sait lire, si bien que personne n'a rien à taper. Les restaurants l'utilisent sur les cartes de table et les menus, les boutiques le placent sur les étiquettes et les tickets, et les organisateurs l'impriment sur les billets et les affiches. Il sert aussi sur les cartes de visite, les brochures, les emballages, les diapositives et les vitrines. Un code statique comme ceux créés ici continue de fonctionner tant que le lien qu'il contient fonctionne, sans abonnement. Testez toujours le code terminé avec un téléphone, dans la lumière où il sera scanné, et laissez une marge blanche dégagée autour."
  tips_h: "Conseils pour un code qui se scanne"
  tips:
    - "Un code foncé sur fond clair se scanne le mieux. Gardez un contraste élevé."
    - "Laissez la marge blanche. Les lecteurs en ont besoin pour repérer les bords."
    - "Un texte plus court donne un code plus simple. Pour une longue adresse, <a href='[[home]]'>raccourcissez d'abord le lien</a>."
    - "Une correction d'erreurs plus élevée aide le code à résister à l'usure, mais rend les carrés plus petits."
    - "Testez avec un téléphone avant d'imprimer. Notre <a href='[[qr_guide]]'>guide taille et contraste</a> donne les détails."
  faq_h: "Questions fréquentes"
  faq:
    - q: "Ce générateur de QR code est-il gratuit ?"
      a: "Oui. Sans inscription, sans filigrane et sans limite de téléchargements."
    - q: "Le QR code expire-t-il ?"
      a: "Non. Le code est le texte lui-même dessiné en carrés : il fonctionne tant que la page ou le texte qu'il contient existe. C'est un code statique, non suivi."
    - q: "Mon texte est-il envoyé à un serveur ?"
      a: "Non. Le code est dessiné dans votre navigateur. Si vous voulez aussi un lien court, utilisez le <a href='[[home]]'>raccourcisseur d'URL</a>, qui envoie l'adresse à notre service de liens."
    - q: "Que puis-je mettre dans un QR code ?"
      a: "Une adresse web est le choix le plus courant, mais tout texte convient, jusqu'à environ 2 900 caractères avec la correction d'erreurs la plus faible. Si un message indique que le texte est trop long, raccourcissez-le."
    - q: "Puis-je imprimer le code sur un produit ou une affiche ?"
      a: "Oui. Téléchargez le SVG, gardez la marge et vérifiez le scan sur une épreuve imprimée d'abord."
