home:
  h1: "Free URL shortener. Short link and QR code in one step."
  lead: "Paste a long web address and get a short one you can copy, share or print. The QR code is drawn on your device and downloads as PNG or SVG. No account needed."
  label_url: "Link to shorten"
  placeholder: "https://example.com/a/very/long/page?with=parameters"
  btn_shorten: "Shorten link"
  opt_summary: "Choose your own ending (optional)"
  opt_label: "Custom ending"
  opt_placeholder: "my_launch_page"
  opt_hint: "5 to 30 letters, numbers or underscores. If it is already taken, pick another."
  copy: "Copy link"
  open: "Open link"
  dl_png: "Download PNG"
  dl_svg: "Download SVG"
  qr_aria: "QR code for your short link"
  recent_h: "Recent links on this device"
  recent_hint: "These are saved only in this browser."
  recent_clear: "Clear list"
  how_h: "How it works"
  steps:
    - t: "Paste your link"
      d: "Any http or https address works, including long ones full of tracking parameters."
    - t: "Shorten it"
      d: "Our link service saves your address and gives back a short one on urlshort.tr. Add your own ending if you want it readable."
    - t: "Copy or scan"
      d: "Copy the short link, or download its QR code for a flyer, menu, slide or product label."
  when_h: "When a short link helps"
  when:
    - t: "Messages and profiles"
      d: "A short link takes less room in a bio, a text or a caption, and it does not wrap across three lines."
    - t: "Anything printed"
      d: "A QR code for a short link has fewer, larger squares than one for a long address, so it is easier to scan from a distance or on a small label. Read <a href='[[print_guide]]'>our print guide</a> before you send a design to the printer."
    - t: "Slides, videos and podcasts"
      d: "People can type a short link from a screen, and you can say it out loud without reading a paragraph of characters."
    - t: "Tidying a messy address"
      d: "Links copied from shops, maps and search results often carry long strings after a question mark. A short link hides that clutter when you share it."
  know_h: "What to know before you use it"
  know:
    - "Short links are created on urlshort.tr and redirect to the address you entered. No sign-up is needed."
    - "A link cannot be edited after it is made. Check the address before you press the button."
    - "Anyone who has a short link can open it. Do not shorten pages that are meant to be private."
    - "Links to other short-link services are not accepted, and harmful links are removed."
    - "You can see where a short link goes before opening it: add a plus sign (+) to the end of the link, or use <a href='[[check]]'>the link checker</a>. Our guide on <a href='[[safe_guide]]'>checking short links</a> explains more."
    - "Found a harmful link? <a href='[[report]]'>Report it</a>."
  extra:
    - h: "A free short URL maker for any kind of link"
      d: "A short URL is simply a shorter web address that sends people to the page you chose. People use a URL shortener for product pages, online forms, videos, maps, documents and event invitations. The long address is stored on our link service, and the short one on urlshort.tr takes visitors to it within a moment. There is nothing to install and nothing to pay. You can make as many short links as you need, within a fair hourly limit that keeps the service fast for everyone and stops automated abuse."
    - h: "Short URL or long URL: which one should you share?"
      d: "Use a long URL when the address will sit inside a page, because readers never see it. Use a short URL when people will see, type, say or scan it: in a message, on a slide, in a printed flyer, in a video description or on a product label. Short links are easier to read out loud, they break less often when a messaging app wraps the line, and they make a QR code simpler, because fewer characters mean larger squares. Our guide on <a href='[[print_guide]]'>QR code size and contrast</a> explains why this matters for print."
    - h: "How to get the most from a short link"
      d: "Choose a custom ending that describes the page, such as summer_menu or team_survey, so people know what to expect before they click. Test the short link yourself before you share it, and keep the original address in a safe place. If you print a QR code, scan it with more than one phone first. Avoid shortening pages that need a login or that you may delete soon, because a short link can only lead to what exists at the destination. When you receive a short link from someone else, add a plus sign (+) to the end to see where it leads before you open it."
  faq_h: "Frequently asked questions"
  faq:
    - q: "Is this URL shortener free?"
      a: "Yes. There is nothing to pay and no sign-up. The site is supported by advertising."
    - q: "Do the short links expire?"
      a: "No expiry date is set. A link keeps working until it is removed, for example if it is reported for abuse. Keep the original address somewhere safe for anything important."
    - q: "Can I change where a short link goes?"
      a: "No. A short link points to the address it was made with. If the destination page moves, create a new short link and replace the old one."
    - q: "Do you track clicks?"
      a: "No. The service does not count clicks or build a profile of the people who open a link."
    - q: "Do you store the links I shorten?"
      a: "Yes, the address and its short ending are saved on our link service, because that is how the redirect works. There are no accounts. A short history of your recent links is also kept in your own browser, and you can clear it at any time."
    - q: "Will the QR code work on every phone?"
      a: "It is a standard QR code, so current phone cameras and scanner apps read it. Always test a code on a phone before you print it, and leave the white border around it in place."
    - q: "Can I use the QR code on printed material or products?"
      a: "Yes. Download the SVG if the printer asks for a vector file, or the PNG for documents and screens. Make sure you are allowed to link to the page the code points to."
qr:
  h1: "QR code generator"
  lead: "Type a web address or any text and the code appears at once. Download it as a PNG for documents and screens, or as an SVG for print. Nothing you type leaves your device."
  label_text: "Link or text"
  placeholder: "https://example.com"
  size_label: "Download size"
  size_s: "Small (512 px)"
  size_m: "Medium (1024 px)"
  size_l: "Large (2048 px)"
  level_label: "Error correction"
  level_l: "Low (about 7%)"
  level_m: "Medium (about 15%)"
  level_q: "Quartile (about 25%)"
  level_h: "High (about 30%)"
  fg_label: "Code colour"
  bg_label: "Background"
  empty: "Your QR code will appear here."
  qr_aria: "Your QR code"
  which_h: "Which file should I download?"
  png_t: "PNG"
  png_d: "A picture made of pixels. Use it in documents, slides, websites and messages. Pick the large size if it will be printed."
  svg_t: "SVG"
  svg_d: "A vector file that stays sharp at any size. Send this to a printer, or use it for signs and packaging."
  extra:
    - h: "Where people use QR codes"
      d: "A QR code turns a web address into a picture a phone camera can read, so nobody has to type anything. Restaurants use them on table cards and menus, shops put them on product labels and receipts, and event organisers print them on tickets and posters. They also work on business cards, brochures, packaging, slides and shop windows. A static code like the ones made here keeps working for as long as the link inside it works, with no subscription. Always test the finished code on a phone, in the light where it will be scanned, and keep a clear white border around it."
  tips_h: "Tips for a code that scans"
  tips:
    - "Dark code on a light background scans best. Keep the contrast high."
    - "Leave the white border in place. Scanners need it to find the edges."
    - "Shorter text makes a simpler code. For a long address, <a href='[[home]]'>shorten the link first</a>."
    - "Higher error correction lets a code survive wear, but it makes the squares smaller."
    - "Test with a phone before you print. Our <a href='[[qr_guide]]'>size and contrast guide</a> has the details."
  faq_h: "Frequently asked questions"
  faq:
    - q: "Is this QR code generator free?"
      a: "Yes. There is no sign-up, no watermark and no limit on downloads."
    - q: "Does the QR code expire?"
      a: "No. The code is the text itself drawn as squares, so it works for as long as the page or text it holds exists. This is a static code, not a tracked one."
    - q: "Is my text sent to a server?"
      a: "No. The code is drawn in your browser. If you want a short link as well, use the <a href='[[home]]'>URL shortener</a>, which sends the address to our link service."
    - q: "What can I put in a QR code?"
      a: "A web address is the most common choice, but any text works, up to a limit of roughly 2,900 characters at the lowest error correction. If you see a message that the text is too long, shorten it."
    - q: "Can I print the code on a product or a poster?"
      a: "Yes. Download the SVG, keep the border, and check the scan on a printed proof first."
